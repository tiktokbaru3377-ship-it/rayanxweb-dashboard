<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://api.rayanx.internal wss://api.rayanx.internal;
      img-src 'self' data: https://*.googleusercontent.com;
      frame-src 'self' https://*.firebaseapp.com;
    ">
    <title>RayanXWeb Console</title>
    <script>
      (function() {
        const t = localStorage.getItem('rayanx_theme') || 'dark';
        document.documentElement.className = t === 'dark' ? 'dark' : '';
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 antialiased font-sans select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
