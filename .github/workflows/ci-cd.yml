name: RayanXWeb Production Continuous Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repositori Kode
        uses: actions/checkout@v4

      - name: 2. Konfigurasi Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-node-version: 20
          cache: 'npm'

      - name: 3. Pemasangan Dependensi Framework Inti
        run: npm ci

      - name: 4. Eksekusi Unit & Integration Testing Matrix
        run: npm run test:ci
        env:
          CI: true

      - name: 5. Kompilasi Aset Statis Teroptimasi (Production Build)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_API_URL: https://console.rayanx.internal/v1

      - name: 6. Pengarsipan Hasil Build (/dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-production-bundle
          path: dist/
          retention-days: 1

  remote-server-delivery:
    needs: audit-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repositori Kode
        uses: actions/checkout@v4

      - name: 2. Unduh Hasil Build dari Tahap Sebelumnya
        uses: actions/download-artifact@v4
        with:
          name: web-production-bundle
          path: dist/

      - name: 3. Sinkronisasi Berkas Kode ke Server Target via RSYNC SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.PRODUCTION_SERVER_IP }}
          REMOTE_USER: deploy_admin
          TARGET: /home/deploy_admin/rayanx_core/
          EXCLUDE: "/node_modules/, /.git/, /.github/"

      - name: 4. Orkestrasi Ulang Kontainer Docker di Server Jarak Jauh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: deploy_admin
          key: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          script: |
            cd /home/deploy_admin/rayanx_core
            docker-compose down
            docker-compose up -d --build
            docker image prune -f
            echo "=== SYSTEM DEPLOYMENT MATRIX CONCLUDED: ONLINE ==="
