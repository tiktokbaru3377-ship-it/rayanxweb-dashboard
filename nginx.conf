user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimasi Bandwidth I/O Tingkat Tinggi
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Konfigurasi Kompresi Gzip untuk Kecepatan Rendering Web SPA
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml stroke/svg+xml;

    # Definisi Hulu Kluster Server Backend RayanX (Load Balancing)
    upstream rayanx_backend_cluster {
        server 10.0.1.50:4000 weight=3;
        server 10.0.1.51:4000 weight=3;
        keepalive 64;
    }

    server {
        listen 443 ssl http2;
        server_name console.rayanx.internal;

        # TLS/SSL Hardening Cryptography Cipher Suites
        ssl_certificate /etc/ssl/certs/rayanx_production.crt;
        ssl_certificate_key /etc/ssl/certs/rayanx_production.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # Distribusi Aset Statis Frontend RayanXWeb SPA
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; # Mencegah galat 404 pada router SPA React
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Proxy Aliran Soket Real-time & API Gateway
        location /v1/ {
            proxy_pass http://rayanx_backend_cluster;
            proxy_http_version 1.1;
            
            # Header Pipa Peningkatan Protokol WebSocket (WebSocket Upgrade Tunnel Headers)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Header Informasi Jaringan Klien Otentik
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pengaturan Batas Waktu Koneksi untuk Menjaga Kestabilan Aliran Data Perangkat
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
